<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交晓智模型状态 · XJCode</title><style>body{font-family:Arial,"Microsoft YaHei",sans-serif;color:#173b37;background:#f4f8f7;margin:0}main{max-width:820px;margin:auto;padding:32px 20px}a{color:#087f6c}h1{font-size:clamp(24px,5vw,34px)}p{line-height:1.7}.note{padding:16px;border-radius:12px;background:#fff;border:1px solid #d9e9e4}.notice{font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;padding:0;list-style:none}.grid li{background:white;border:1px solid #d9e9e4;border-radius:10px;padding:12px;display:flex;justify-content:space-between;gap:8px;overflow-wrap:anywhere}.ok{color:#147a55}.down{color:#b52f37}.unknown{color:#785a12}small{color:#526c66}</style></head><body><main><a href="https://xjcode.wenshanzhike.com/">← 返回 XJCode</a><h1>交晓智模型状态</h1><p class="note">这里展示航院智课共享账号池的每日检测结果，通常在北京时间 9:00 进行。XJCode 使用的是你的个人账号，权限和可用情况可能不同，请以个人账号的实际调用结果为准。</p><p id="summary" class="notice" role="status" aria-live="polite">正在读取检测结果…</p><p id="checked"><small>检测时间：读取中</small></p><ul id="models" class="grid"></ul><p><small>目录调整、网络故障或检测中断都可能造成状态待确认。结果超过 28 小时会显示为待确认。遇到问题可在 XJCode 运行 <code>xjcode diagnostics</code> 查看本机脱敏记录。</small></p></main><script>
async function refresh(){const summary=document.getElementById('summary'),checked=document.getElementById('checked'),list=document.getElementById('models');try{const response=await fetch('/model-health-20261111/status.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('unavailable');const data=await response.json();const age=Date.now()-Date.parse(data.checked_at);if(!Number.isFinite(age)||age< -300000||!data.models||typeof data.models!=='object')throw Error('invalid');const stale=age>28*3600000;let n=0;list.replaceChildren();for(const [id,value] of Object.entries(data.models).slice(0,100)){if(!/^[a-zA-Z0-9._-]{1,80}$/.test(id))continue;const state=stale?'unknown':value?.state;const item=document.createElement('li'),name=document.createElement('span'),badge=document.createElement('strong');name.textContent=id;badge.textContent=state==='available'?'检测通过':state==='upstream_unavailable'?'上游不可用':'状态待确认';badge.className=state==='available'?'ok':state==='upstream_unavailable'?'down':'unknown';item.append(name,badge);list.append(item);n++;}if(!n)throw Error('empty');summary.textContent=stale?'检测结果已过期，当前状态待确认。':'检测结果已更新。';checked.textContent='最近检测：'+new Date(data.checked_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+'（北京时间）';}catch{summary.textContent='当前无法读取检测结果，请稍后再试。';checked.textContent='检测时间：待确认';list.replaceChildren();}}refresh();setInterval(refresh,300000);</script></body></html>
