[package]
name = "xjcode-native"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[lib]
name = "xjcode_native"

[[bin]]
name = "xjcode"
path = "src/main.rs"

[[bin]]
name = "xjcode-login"
path = "src/login.rs"
required-features = ["login"]

[features]
login = ["dep:wry", "dep:tao"]

[dependencies]
anyhow = "1"
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
cfb-mode = "0.8"
chrono = "0.4"
eventsource-stream = "0.2"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
jsonschema = { version = "0.33", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tempfile = "3"
toml_edit = "0.23"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Threading"] }
wry = { version = "0.54", optional = true }
tao = { version = "0.34", optional = true }
