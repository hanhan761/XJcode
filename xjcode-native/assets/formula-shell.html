<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>公式 · XJCode</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#172b35;font-family:Arial,"Microsoft YaHei",sans-serif;line-height:1.6}main{max-width:1060px;padding:28px 24px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}h1{font-size:24px;margin:0}p{margin:6px 0;color:#52646d}.badge{font-size:13px;color:#52646d}button,select,textarea{font:inherit}button,select{border:1px solid #c6d1d6;background:#fff;border-radius:5px;padding:8px 12px;color:inherit}button{cursor:pointer}button:hover{background:#eaf3f0;border-color:#087f6c}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #087f6c;outline-offset:2px}button:disabled{opacity:.45;cursor:default}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border:1px solid #d7e0e4;border-radius:8px;padding:18px;min-width:0}label,h2{display:block;font-size:15px;font-weight:600;margin:0 0 10px}textarea{width:100%;height:210px;resize:vertical;border:1px solid #bbc9d0;border-radius:4px;padding:12px;font-family:Consolas,Arial,"Microsoft YaHei",monospace;line-height:1.6;tab-size:2}#preview{min-height:210px;overflow:auto;padding:24px 8px;display:grid;place-items:center}#preview math{font-family:"Cambria Math",math;font-size:25px}#error{color:#a32335;min-height:26px;font-size:14px;overflow-wrap:anywhere}#status{min-height:26px;color:#087060;font-size:14px}small{color:#52646d}.primary{background:#087f6c;color:white;border-color:#087f6c}.primary:hover{background:#076857}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}footer{margin-top:18px;font-size:13px;color:#52646d}@media(max-width:700px){main{padding:18px 14px}.workspace{grid-template-columns:1fr}header{align-items:flex-start}#preview{min-height:120px}textarea{height:180px}}
</style></head><body><main>
<header><div><h1>公式</h1><p>选模板、改符号，复制后粘贴到 XJCode。</p></div><span class="badge">离线使用</span></header>
<div class="toolbar" id="templates" aria-label="公式模板"></div>
<div class="workspace"><section class="panel"><label for="source">LaTeX</label><textarea id="source" spellcheck="false" maxlength="12000" aria-describedby="input-help error">\frac{F}{A} = \sigma</textarea><small id="input-help">选中文字后点模板，可将所选内容放入公式。支持粘贴 $…$、$$…$$。</small><div class="actions"><button id="undo" type="button">撤销</button><button id="redo" type="button">重做</button><button id="clear" type="button">清空</button></div></section>
<section class="panel"><h2>预览</h2><div id="preview" aria-label="公式预览"></div><div id="error" role="status" aria-live="polite"></div></section></div>
<div class="actions"><label for="format" style="margin:auto 0">复制格式</label><select id="format"><option value="latex">LaTeX 原文</option><option value="inline">Markdown 行内</option><option value="block">Markdown 独立公式</option></select><button class="primary" id="copy" type="button">复制公式</button><button id="download" type="button">保存 .md</button></div>
<div id="status" role="status" aria-live="polite"></div>
<footer>Ctrl+Enter 复制 · Ctrl+Z 撤销 · Ctrl+Shift+Z 重做。页面刷新可恢复本标签页草稿；关闭标签页后不保留。公式不上传。预览：KaTeX 0.19.1（MIT），使用系统数学字体。</footer>
</main><script>/* XJCODE_KATEX */</script><script>/* XJCODE_EDITOR */</script></body></html>
